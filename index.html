<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b66d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="展開舟">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>展開舟</title>
<style>
:root{--bg:#f2f6fb;--card:#fff;--ink:#112033;--muted:#69788e;--line:#d9e2ee;--blue:#0b66d8;--blue2:#2b8be7;--green:#0b9a62;--orange:#e6811f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}body{min-height:100dvh}
header{position:sticky;top:0;z-index:30;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;box-shadow:0 4px 16px #0b4c9f2b}header h1{margin:0;font-size:24px}header p{margin:4px 0 0;font-size:12px;opacity:.92}
main{max-width:920px;margin:auto;padding:12px 12px calc(110px + env(safe-area-inset-bottom))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0;box-shadow:0 4px 18px #1b34500c}.notice{background:#fff8eb;border-color:#efd8b3}.sub{font-size:12px;line-height:1.55;color:var(--muted)}
.controls{display:grid;grid-template-columns:1fr 110px;gap:8px}.field label,.boat label{display:block;font-size:10px;color:var(--muted);margin:0 0 4px}.field input,.boat input,.boat select{width:100%;min-height:42px;border:1px solid #cad5e3;border-radius:10px;background:#fff;padding:9px;font-size:16px;color:var(--ink)}
.sectionTitle{font-weight:800;margin-bottom:6px}.boats{display:grid;gap:9px}.boat{display:grid;grid-template-columns:42px 76px repeat(5,86px);gap:7px;align-items:end;border:1px solid var(--line);border-radius:14px;padding:9px;overflow-x:auto;background:#fff;scrollbar-width:none}.boat::-webkit-scrollbar{display:none}.lane{width:38px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;border:1px solid #c7d0dd}.l1{background:#fff}.l2{background:#222;color:#fff}.l3{background:#e95b5b;color:#fff}.l4{background:#4f7fe5;color:#fff}.l5{background:#f0d84d}.l6{background:#48a768;color:#fff}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:9px;background:linear-gradient(180deg,#f2f6fb00,#f2f6fb 28%)}button{min-height:52px;border-radius:14px;font-size:16px;font-weight:900;border:0}.secondary{width:36%;background:#fff;color:var(--blue);border:1px solid #b9c9dc}.primary{flex:1;background:var(--blue);color:#fff;box-shadow:0 8px 20px #0b66d82d}.primary:active,.secondary:active{transform:scale(.99)}
.hidden{display:none}.resultHead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.badge{font-size:11px;background:#eaf3ff;color:#0e5dbc;padding:6px 8px;border-radius:999px;font-weight:800}.scenario{font-size:20px;font-weight:900;margin:7px 0}.flow{overflow:auto;white-space:nowrap;padding:7px 0;font-size:13px}.rank{display:grid;grid-template-columns:38px 1fr 48px;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}.bar{height:9px;background:#edf2f7;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#13a06d,var(--blue));border-radius:999px}.mini{font-size:10px;color:var(--muted);margin-top:4px}.score{text-align:right;font-weight:900}.tickets{display:flex;flex-wrap:wrap;gap:7px}.ticket{background:#101b2b;color:#fff;border-radius:10px;padding:9px 11px;font-weight:900;letter-spacing:.05em}.installHint{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}
@media(max-width:620px){main{padding-left:9px;padding-right:9px}.controls{grid-template-columns:1fr 100px}.boat{grid-template-columns:40px 72px repeat(5,82px);padding:8px}.card{border-radius:14px}.scenario{font-size:18px}}
</style>
</head>
<body>
<header><h1>展開舟</h1><p>平均STを土台に、1Mの攻め・壁・凹み・残しを読む</p></header>
<main>
<section class="card notice"><b>スマホ版 β</b><div class="sub">展示Fは単純に減点せず、平均STを主軸に判定。入力内容はこの端末に自動保存されます。</div></section>
<section class="card"><div class="controls"><div class="field"><label>レース名</label><input id="race" value="常滑 5R"></div><div class="field"><label>風速 m/s</label><input id="wind" type="number" inputmode="decimal" step="0.1" value="3"></div></div></section>
<section class="card"><div class="sectionTitle">6艇データ</div><div class="sub">STは「0.14」、展示F.03は「-0.03」で入力。</div><div id="boats" class="boats"></div></section>
<section id="result" class="card hidden"></section>
<div class="installHint">Safariで開いて「共有 → ホーム画面に追加」でアプリ風に使えます（HTTPSで設置した場合）。</div>
</main>
<div class="actions"><button id="sample" class="secondary">サンプル</button><button id="analyze" class="primary">展開を読む</button></div>
<script>
'use strict';
const defaults=[
 {cls:'A2',avg:.16,ex:.12,time:6.81,nat:5.56,local:4.75},
 {cls:'A1',avg:.14,ex:-.03,time:6.76,nat:6.55,local:5.50},
 {cls:'B2',avg:.21,ex:.34,time:6.81,nat:1.50,local:1.42},
 {cls:'B2',avg:.22,ex:.22,time:6.76,nat:1.49,local:1.12},
 {cls:'A2',avg:.15,ex:-.07,time:6.74,nat:6.28,local:6.74},
 {cls:'B1',avg:.21,ex:-.08,time:6.81,nat:3.71,local:3.22}
];
const boatsEl=document.getElementById('boats');
const storeKey='tenkaibune_mobile_v1';
function safeNum(v,fallback=0){const n=Number(v);return Number.isFinite(n)?n:fallback}
function clamp(x,a=0,b=100){return Math.max(a,Math.min(b,x))}
function clsPts(c){return ({A1:14,A2:9,B1:4,B2:0})[c]||0}
function makeRows(data){boatsEl.innerHTML='';data.forEach((d,i)=>{const n=i+1,el=document.createElement('div');el.className='boat';el.innerHTML=`<div class="lane l${n}">${n}</div><div><label>級別</label><select data-k="cls"><option>A1</option><option>A2</option><option>B1</option><option>B2</option></select></div><div><label>平均ST</label><input data-k="avg" inputmode="decimal" value="${d.avg}"></div><div><label>展示ST</label><input data-k="ex" inputmode="decimal" value="${d.ex}"></div><div><label>展示タイム</label><input data-k="time" inputmode="decimal" value="${d.time}"></div><div><label>全国勝率</label><input data-k="nat" inputmode="decimal" value="${d.nat}"></div><div><label>当地勝率</label><input data-k="local" inputmode="decimal" value="${d.local}"></div>`;boatsEl.appendChild(el);el.querySelector('select').value=d.cls});bindAutosave()}
function getData(){return [...document.querySelectorAll('.boat')].map((r,i)=>{const v=k=>r.querySelector(`[data-k="${k}"]`).value;return{lane:i+1,cls:v('cls'),avg:safeNum(v('avg'),.20),ex:safeNum(v('ex'),.20),time:safeNum(v('time'),6.90),nat:safeNum(v('nat'),0),local:safeNum(v('local'),0)}})}
function save(){try{localStorage.setItem(storeKey,JSON.stringify({race:document.getElementById('race').value,wind:document.getElementById('wind').value,boats:getData()}))}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem(storeKey));if(x&&Array.isArray(x.boats)&&x.boats.length===6){document.getElementById('race').value=x.race||'';document.getElementById('wind').value=x.wind||'';makeRows(x.boats);return}}catch(e){}makeRows(defaults)}
function bindAutosave(){document.querySelectorAll('input,select').forEach(el=>{el.oninput=save;el.onchange=save})}
function analyze(){const b=getData();
 b.forEach(x=>{const avgStart=clamp((.25-x.avg)*240,0,36);const exStart=clamp((.20-x.ex)*55,-4,16);const feet=clamp((6.95-x.time)*45,0,14);const ability=clamp((x.nat-2)*4+(x.local-2)*2+clsPts(x.cls),0,35);const inside=(7-x.lane)*2.2;x.attack=clamp(avgStart+exStart+feet+ability+inside);x.hold=clamp(ability+avgStart*.8+(x.lane===1?26:0)+(x.lane===2?9:0));x.wall=clamp(avgStart*.7+ability*.35+(x.lane<=3?12:4)-Math.max(0,(x.avg-.18)*120))});
 for(let i=1;i<b.length;i++){const left=b[i-1],cur=b[i],gap=left.avg-cur.avg;if(gap>=.04){cur.attack=clamp(cur.attack+8);left.wall=clamp(left.wall-7)}if(gap<=-.04)cur.attack=clamp(cur.attack-4)}
 const sorted=[...b].sort((a,c)=>c.attack-a.attack),attacker=sorted[0],inner=b[0],second=b[1];let scenario,detail;
 if(inner.hold>=72&&(attacker.lane===1||inner.attack>=sorted[1].attack-6)){scenario='①先マイ本線';detail='インの残し性能が高め。外の攻めは2着争いに回りやすい。'}else if(second.attack>=inner.hold+4){scenario='②差し・まくり両睨み';detail='②のST基礎力が①を上回る。③が壁にならない場合は握る展開まで。'}else if(attacker.lane>=4){scenario=`${attacker.lane}号艇の外攻め警戒`;detail=`${attacker.lane}号艇の平均ST・足・地力が高い。内の凹み次第で1Mへ突入。`}else{scenario=`${attacker.lane}号艇が攻めの起点`;detail=`${attacker.lane}号艇を中心に、内残しと外連動を見る。`}
 b.forEach(x=>{const lanePenalty=(x.lane-1)*3.7;x.first=clamp(x.attack*.58+x.hold*.42-lanePenalty);x.second=clamp(x.attack*.50+x.hold*.22+x.wall*.12+(x.lane>=4?5:0));x.third=clamp(x.attack*.32+x.wall*.30+x.hold*.12+(x.lane>=5?8:0))});
 const top3=k=>[...b].sort((a,c)=>c[k]-a[k]).slice(0,3),f=top3('first'),s=top3('second'),t=top3('third'),combos=[];
 for(const a of f)for(const c of s)for(const d of t){if(new Set([a.lane,c.lane,d.lane]).size<3)continue;combos.push({txt:`${a.lane}-${c.lane}-${d.lane}`,sc:a.first*1.2+c.second+d.third*.8})}combos.sort((a,c)=>c.sc-a.sc);const uniq=[];for(const c of combos){if(!uniq.some(x=>x.txt===c.txt))uniq.push(c);if(uniq.length===6)break}
 const weak=b.filter(x=>x.avg>=.20&&x.ex>=.20).map(x=>x.lane),fast=b.filter(x=>x.avg<=.15).map(x=>x.lane),out=document.getElementById('result');out.classList.remove('hidden');out.innerHTML=`<div class="resultHead"><div><b>${escapeHtml(document.getElementById('race').value||'レース')} 展開予測</b><div class="scenario">${scenario}</div></div><span class="badge">展開舟 β</span></div><div class="sub">${detail}</div><div class="flow"><b>平均ST</b> → ${b.map(x=>`${x.lane}:${x.avg.toFixed(2)}`).join('　')}</div>${weak.length?`<div class="sub">凹み候補：<b>${weak.join('・')}</b>　／　平均ST上位：<b>${fast.join('・')||'なし'}</b></div>`:''}<h3>攻め指数</h3>${[...b].sort((a,c)=>c.attack-a.attack).map(x=>`<div class="rank"><div class="lane l${x.lane}">${x.lane}</div><div><div class="bar"><i style="width:${x.attack}%"></i></div><div class="mini">残し ${x.hold.toFixed(0)} / 壁 ${x.wall.toFixed(0)}</div></div><div class="score">${x.attack.toFixed(0)}</div></div>`).join('')}<h3>展開からの上位6点</h3><div class="tickets">${uniq.map((x,i)=>`<span class="ticket">${i===0?'◎ ':i===1?'○ ':''}${x.txt}</span>`).join('')}</div><p class="sub">※ オッズ未使用。これは1M展開を読むための参考ロジックです。</p>`;save();setTimeout(()=>out.scrollIntoView({behavior:'smooth',block:'start'}),50)}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
document.getElementById('analyze').addEventListener('click',analyze);document.getElementById('sample').addEventListener('click',()=>{makeRows(defaults);document.getElementById('result').classList.add('hidden');save()});document.getElementById('race').addEventListener('input',save);document.getElementById('wind').addEventListener('input',save);load();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
